    const viewContainer = document.getElementById("view-container");
    const langBar = document.getElementById("lang-bar");
    const mainHeader = document.getElementById("main-header");
    const homeTitleBox = document.getElementById("home-title-box");
    const headerSub = document.getElementById("header-sub");
    const headerTitle = document.getElementById("header-title");
    const btnBack = document.getElementById("btn-back");
    const backText = document.getElementById("back-text");
    const footerText = document.getElementById("footer-text");

    window.setLanguage = function(lang) {
      currentLang = lang;

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.className = "lang-btn px-2.5 py-1 rounded-full font-semibold transition-all text-stone-600 hover:bg-stone-200";
      });
      const activeBtn = document.getElementById(`lang-${lang}`);
      if (activeBtn) {
        activeBtn.className = "lang-btn px-2.5 py-1 rounded-full font-bold transition-all bg-orange-500 text-white";
      }

      const i18n = I18N[currentLang];
      headerSub.innerText = i18n.headerSub;
      headerTitle.innerText = i18n.headerTitle;
      backText.innerText = i18n.backText;
      footerText.innerText = i18n.footerText;

      render();
    };

    window.selectStatus = function(categoryId) {
      const cat = STATUS_CATEGORIES.find(c => c.id === categoryId);
      if (!cat) return;

      history.push({ view: "home" });

      if (cat.directResult) {
        currentView = "result";
        currentSubNode = cat.directResult;
      } else if (cat.nextQuestion) {
        currentView = "question";
        currentSubNode = cat.nextQuestion;
      }
      render();
    };

    window.handleAnswer = function(choice) {
      const node = SUB_QUESTIONS[currentSubNode];
      const nextTarget = node[choice];

      history.push({ view: "question", nodeKey: currentSubNode });

      if (typeof nextTarget === "string") {
        currentView = "question";
        currentSubNode = nextTarget;
      } else if (nextTarget && nextTarget.result) {
        currentView = "result";
        currentSubNode = nextTarget.result;
      }
      render();
    };

    btnBack.addEventListener("click", () => {
      if (history.length > 0) {
        const prev = history.pop();
        currentView = prev.view;
        currentSubNode = prev.nodeKey || null;
        render();
      }
    });

    window.resetQuiz = function() {
      history = [];
      currentView = "home";
      currentSubNode = null;
      render();
    };

    function render() {
      const i18n = I18N[currentLang];

      if (currentView === "home") {
        langBar.classList.remove("hidden");
        homeTitleBox.classList.remove("hidden");
        mainHeader.classList.remove("hidden");
        mainHeader.className = "p-5 pb-3 relative border-b border-orange-50 text-center";
        btnBack.classList.add("hidden");
      } else {
        langBar.classList.add("hidden");
        homeTitleBox.classList.add("hidden");
        mainHeader.className = "p-3 text-center relative border-b border-stone-100 min-h-[44px]";
        btnBack.classList.remove("hidden");
      }

      // 1. 홈 화면 (5개 카드: 2열 그리드 + 마지막 카드 중앙 정렬)
      if (currentView === "home") {
        let html = `<div class="animate-fade-in grid grid-cols-2 gap-2.5 py-1">`;
        
        STATUS_CATEGORIES.forEach((cat, index) => {
          const item = cat[currentLang] || cat["ko"];
          const isImageFile = cat.icon.includes(".");
          const isLastItem = (index === STATUS_CATEGORIES.length - 1);
          const gridSpan = isLastItem ? "col-span-2 sm:col-span-1 sm:col-start-1 sm:col-end-3 max-w-[200px] mx-auto w-full" : "w-full";

          const iconMarkup = isImageFile
            ? `<img src="${cat.icon}" alt="icon" onerror="this.onerror=null; this.outerHTML='<span class=\\'text-3xl mb-1 leading-none\\'>${cat.fallbackEmoji || '🥕'}</span>';" class="w-12 h-12 object-contain mb-1 drop-shadow-sm group-hover:scale-105 transition-transform" />`
            : `<span class="text-3xl mb-1 leading-none">${cat.icon}</span>`;

          html += `
            <button onclick="selectStatus('${cat.id}')" class="${gridSpan} p-3 rounded-2xl bg-white hover:bg-orange-50/50 border border-stone-200/80 hover:border-orange-200 active:scale-[0.97] transition-all flex flex-col items-center justify-center text-center group shadow-sm min-h-[110px]">
              ${iconMarkup}
              <h2 class="text-sm font-extrabold text-stone-900 leading-snug break-keep whitespace-pre-line mt-0.5">${item.title}</h2>
            </button>
          `;
        });

        html += `</div>`;
        viewContainer.innerHTML = html;
      }

      // 2. 질문 화면
      else if (currentView === "question") {
        const node = SUB_QUESTIONS[currentSubNode];
        const qData = node.questions[currentLang] || node.questions["ko"];
        const yesLabel = qData.yesText || i18n.defaultYes;
        const noLabel = qData.noText || i18n.defaultNo;

        viewContainer.innerHTML = `
          <div class="animate-fade-in flex flex-col justify-between h-full py-2">
            <div class="my-auto text-center py-6">
              <h2 class="text-xl sm:text-2xl font-black text-stone-900 leading-snug break-keep">
                ${qData.q}
              </h2>
            </div>

            <div class="grid grid-cols-1 gap-2.5 pt-4">
              <button onclick="handleAnswer('yes')" class="w-full py-3.5 px-4 rounded-2xl bg-orange-500 hover:bg-orange-600 active:scale-[0.98] transition-all text-white font-bold text-sm shadow-md shadow-orange-500/20 flex items-center justify-center text-center break-keep">
                ${yesLabel}
              </button>
              <button onclick="handleAnswer('no')" class="w-full py-3.5 px-4 rounded-2xl bg-stone-100 hover:bg-stone-200 active:scale-[0.98] transition-all text-stone-700 font-semibold text-sm flex items-center justify-center text-center break-keep">
                ${noLabel}
              </button>
            </div>
          </div>
        `;
      }

      // 3. 결과 화면
      else if (currentView === "result") {
        const menuObj = MENUS[currentSubNode];
        const menu = menuObj[currentLang] || menuObj["ko"];
        const targetOrderUrl = menuObj.orderUrl;

        viewContainer.innerHTML = `
          <div class="animate-fade-in flex flex-col justify-between h-full text-center py-1">
            <div class="my-auto py-2">
              <span class="inline-block px-3 py-1 bg-orange-100 text-orange-700 text-xs font-extrabold rounded-full mb-3">
                ${i18n.recommendBadge}
              </span>
              <h2 class="text-2xl font-extrabold text-stone-900 tracking-tight mb-2">
                ${menu.name}
              </h2>
              <p class="text-xs font-semibold text-orange-600 tracking-wide mb-3">
                ${menu.tag}
              </p>
              <div class="bg-orange-50/70 p-4 rounded-2xl border border-orange-100 text-stone-700 text-sm leading-relaxed break-keep">
                ${menu.desc}
              </div>
            </div>

            <div class="flex flex-col gap-2 pt-3">
              <a href="${targetOrderUrl}" target="_blank" rel="noopener noreferrer" class="w-full py-3.5 px-5 rounded-2xl bg-green-600 hover:bg-green-700 active:scale-[0.98] transition-all text-white font-bold text-sm shadow-md shadow-green-600/20 flex items-center justify-center gap-2">
                <span>${i18n.orderBtn}</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </a>
              <button onclick="resetQuiz()" class="w-full py-2 text-stone-400 hover:text-stone-600 text-xs font-medium transition-colors">
                ${i18n.restartBtn}
              </button>
            </div>
          </div>
        `;
      }
    }

    setLanguage("ko");
  </script>
