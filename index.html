        zh: { name: "胡萝卜可乐达", tag: "#海岛度假风 #热带果香 #清爽解渴", desc: "椰香与热带果味交织，酸甜清爽，喝一口仿佛漫步在海岛！" },

        zh: { name: "苹果胡萝卜汁", tag: "#酸甜爽口 #百喝不腻 #人气第一", desc: "清甜苹果搭配鲜嫩胡萝卜，酸甜适口，谁喝都会喜欢的经典第一名！" },
        fr: { name: "Carotte Pomme", tag: "#DouxEtFrais #Incontournable #TopVente", desc: "La douceur de la pomme mariée à la carotte. Le grand classique adoré de tous !" }

    };

    const viewContainer = document.getElementById("view-container");
    const btnBack = document.getElementById("btn-back");
    const backText = document.getElementById("back-text");
    const headerTitle = document.getElementById("header-title");
    const headerSub = document.getElementById("header-sub");
    const footerText = document.getElementById("footer-text");

    // 언어 설정
    window.setLanguage = function(lang) {
      currentLang = lang;

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.className = "lang-btn px-2.5 py-1 rounded-full font-semibold transition-all text-stone-600 hover:bg-stone-200";
      });
      const activeBtn = document.getElementById(`lang-${lang}`);
      if (activeBtn) {
        activeBtn.className = "lang-btn px-2.5 py-1 rounded-full font-bold transition-all bg-orange-500 text-white shadow-sm";
      }

      const i18n = I18N[currentLang];
      headerTitle.innerText = i18n.headerTitle;
      headerSub.innerText = i18n.headerSub;
      backText.innerText = i18n.backText;
      footerText.innerText = i18n.footerText;

      render();
    };

    // 1단계 상태 선택
    window.selectStatus = function(categoryId) {
      const cat = STATUS_CATEGORIES.find(c => c.id === categoryId);
      if (!cat) return;

      history.push({ view: "home" });

      if (cat.directResult) {
        currentView = "result";
        currentSubNode = cat.directResult;
      } else if (cat.nextQuestion) {
        currentView = "question";
        currentSubNode = cat.nextQuestion;
      }
      render();
    };

    // 2단계/3단계 질문 답변
    window.handleAnswer = function(choice) {
      const node = SUB_QUESTIONS[currentSubNode];
      const nextTarget = node[choice];

      history.push({ view: "question", nodeKey: currentSubNode });

      if (typeof nextTarget === "string") {
        currentView = "question";
        currentSubNode = nextTarget;
      } else if (nextTarget && nextTarget.result) {
        currentView = "result";
        currentSubNode = nextTarget.result;
      }
      render();
    };

    // 뒤로가기
    btnBack.addEventListener("click", () => {
      if (history.length > 0) {
        const prev = history.pop();
        currentView = prev.view;
        currentSubNode = prev.nodeKey || null;
        render();
      }
    });

    // 리셋
    window.resetQuiz = function() {
      history = [];
      currentView = "home";
      currentSubNode = null;
      render();
    };

    // 화면 렌더링
    function render() {
      const i18n = I18N[currentLang];

      if (history.length > 0) {
        btnBack.classList.remove("hidden");
      } else {
        btnBack.classList.add("hidden");
      }

      // 1. 홈 화면 (직관적 상태 선택)
      if (currentView === "home") {
        headerSub.classList.remove("hidden");
        let html = `<div class="animate-fade-in flex flex-col gap-3">`;
        
        STATUS_CATEGORIES.forEach(cat => {
          const item = cat[currentLang] || cat["ko"];
          html += `
            <button onclick="selectStatus('${cat.id}')" class="w-full text-left p-4 rounded-2xl bg-orange-50/50 hover:bg-orange-100/70 border border-orange-100 active:scale-[0.99] transition-all flex items-center gap-3.5 group shadow-sm">
              <span class="text-2xl p-2 bg-white rounded-xl shadow-sm group-hover:scale-110 transition-transform">${cat.icon}</span>
              <div class="flex-1 min-w-0">
                <h2 class="text-sm font-bold text-stone-900 leading-snug">${item.title}</h2>
                <p class="text-xs text-stone-500 mt-0.5 truncate">${item.desc}</p>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-orange-400 group-hover:translate-x-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          `;
        });

        html += `</div>`;
        viewContainer.innerHTML = html;
      }

      // 2. 세부 질문 화면
      else if (currentView === "question") {
        headerSub.classList.add("hidden");
        const node = SUB_QUESTIONS[currentSubNode];
        const qData = node.questions[currentLang] || node.questions["ko"];
        const yesLabel = qData.yesText || i18n.defaultYes;
        const noLabel = qData.noText || i18n.defaultNo;

        viewContainer.innerHTML = `
          <div class="animate-fade-in flex flex-col justify-between h-full py-2">
            <div class="my-auto text-center py-4">
              <span class="text-orange-500 font-bold text-xs tracking-wider uppercase bg-orange-100/80 px-2.5 py-1 rounded-full">CHECK</span>
              <h2 class="text-xl font-bold text-stone-900 mt-3 mb-2 leading-snug break-keep">
                ${qData.q}
              </h2>
              <p class="text-xs sm:text-sm text-stone-500 break-keep">
                ${qData.sub}
              </p>
            </div>

            <div class="grid grid-cols-1 gap-3 pt-4">
              <button onclick="handleAnswer('yes')" class="w-full py-4 px-4 rounded-2xl bg-orange-500 hover:bg-orange-600 active:scale-[0.98] transition-all text-white font-bold text-sm sm:text-base shadow-lg shadow-orange-500/25 flex items-center justify-center text-center break-keep">
                ${yesLabel}
              </button>
              <button onclick="handleAnswer('no')" class="w-full py-4 px-4 rounded-2xl bg-stone-100 hover:bg-stone-200 active:scale-[0.98] transition-all text-stone-700 font-semibold text-sm sm:text-base flex items-center justify-center text-center break-keep">
                ${noLabel}
              </button>
            </div>
          </div>
        `;
      }

      // 3. 최종 결과 화면
      else if (currentView === "result") {
        headerSub.classList.add("hidden");
        const menuObj = MENUS[currentSubNode];
        const menu = menuObj[currentLang] || menuObj["ko"];

        viewContainer.innerHTML = `
          <div class="animate-fade-in flex flex-col justify-between h-full text-center py-1">
            <div class="my-auto py-2">
              <span class="inline-block px-3 py-1 bg-orange-100 text-orange-700 text-xs font-extrabold rounded-full mb-3">
                ${i18n.recommendBadge}
              </span>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-stone-900 tracking-tight mb-2">
                ${menu.name}
              </h2>
              <p class="text-xs font-semibold text-orange-600 tracking-wide mb-4">
                ${menu.tag}
              </p>
              <div class="bg-orange-50/70 p-4 sm:p-5 rounded-2xl border border-orange-100 text-stone-700 text-sm leading-relaxed break-keep">
                ${menu.desc}
              </div>
            </div>

            <div class="flex flex-col gap-2.5 pt-3">
              <a href="${NAVER_ORDER_URL}" target="_blank" rel="noopener noreferrer" class="w-full py-4 px-5 rounded-2xl bg-green-600 hover:bg-green-700 active:scale-[0.98] transition-all text-white font-bold text-base shadow-lg shadow-green-600/20 flex items-center justify-center gap-2">
                <span>${i18n.orderBtn}</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </a>
              <button onclick="resetQuiz()" class="w-full py-2 text-stone-400 hover:text-stone-600 text-xs font-medium transition-colors">
                ${i18n.restartBtn}
              </button>
            </div>
          </div>
        `;
      }
    }

    // 초기 실행
    setLanguage("ko");
  </script>
