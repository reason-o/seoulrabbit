    const viewContainer = document.getElementById("view-container");
    const btnBack = document.getElementById("btn-back");
    const backText = document.getElementById("back-text");
    const headerTitle = document.getElementById("header-title");
    const footerText = document.getElementById("footer-text");
    const progressBar = document.getElementById("progress-bar");
    const progressContainer = document.getElementById("progress-container");

    // 언어 변경 함수
    window.setLanguage = function(lang) {
      currentLang = lang;

      // 언어 버튼 스타일 업데이트
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.className = "lang-btn px-2.5 py-1 rounded-full font-semibold transition-all text-stone-600 hover:bg-stone-200";
      });
      const activeBtn = document.getElementById(`lang-${lang}`);
      if (activeBtn) {
        activeBtn.className = "lang-btn px-2.5 py-1 rounded-full font-bold transition-all bg-orange-500 text-white shadow-sm";
      }

      // 공통 UI 텍스트 업데이트
      const i18n = I18N[currentLang];
      headerTitle.innerText = i18n.headerTitle;
      backText.innerText = i18n.backText;
      footerText.innerText = i18n.footerText;

      render();
    };

    // 화면 렌더링
    function render() {
      const node = TREE[currentNodeKey];
      const i18n = I18N[currentLang];

      // 뒤로가기 버튼 노출 여부
      if (history.length > 0) {
        btnBack.classList.remove("hidden");
      } else {
        btnBack.classList.add("hidden");
      }

      // 1. 질문 화면
      if (node && node.questions) {
        progressContainer.classList.remove("hidden");
        const progressPercent = Math.min((node.step / 5) * 100, 100);
        progressBar.style.width = `${progressPercent}%`;

        const qData = node.questions[currentLang] || node.questions["ko"];
        const yesLabel = qData.yesText || i18n.defaultYes;
        const noLabel = qData.noText || i18n.defaultNo;

        viewContainer.innerHTML = `
          <div class="animate-fade-in flex flex-col justify-between h-full">
            <div class="my-auto py-4 text-center">
              <span class="text-orange-500 font-bold text-xs tracking-wider uppercase">${i18n.questionBadge} ${node.step}</span>
              <h2 class="text-xl sm:text-2xl font-bold text-stone-900 mt-2 mb-3 leading-snug break-keep">
                ${qData.q}
              </h2>
              <p class="text-sm text-stone-500 break-keep">
                ${qData.sub}
              </p>
            </div>

            <div class="grid grid-cols-1 gap-3 pt-4">
              <button onclick="handleAnswer('yes')" class="w-full py-3.5 px-5 rounded-2xl bg-orange-500 hover:bg-orange-600 active:scale-[0.98] transition-all text-white font-bold text-base shadow-lg shadow-orange-500/25 flex items-center justify-center">
                ${yesLabel}
              </button>
              <button onclick="handleAnswer('no')" class="w-full py-3.5 px-5 rounded-2xl bg-stone-100 hover:bg-stone-200 active:scale-[0.98] transition-all text-stone-700 font-semibold text-base flex items-center justify-center">
                ${noLabel}
              </button>
            </div>
          </div>
        `;
      } 
      // 2. 최종 결과 화면
      else if (node && node.result) {
        progressContainer.classList.add("hidden");
        const menuObj = MENUS[node.result];
        const menu = menuObj[currentLang] || menuObj["ko"];

        viewContainer.innerHTML = `
          <div class="animate-fade-in flex flex-col justify-between h-full text-center">
            <div class="my-auto py-2">
              <span class="inline-block px-3 py-1 bg-orange-100 text-orange-700 text-xs font-extrabold rounded-full mb-3">
                ${i18n.recommendBadge}
              </span>
              <h2 class="text-3xl font-extrabold text-stone-900 tracking-tight mb-2">
                ${menu.name}
              </h2>
              <p class="text-xs font-semibold text-orange-600 tracking-wide mb-4">
                ${menu.tag}
              </p>
              <div class="bg-orange-50/70 p-5 rounded-2xl border border-orange-100 text-stone-700 text-sm leading-relaxed break-keep mb-2">
                ${menu.desc}
              </div>
            </div>

            <div class="flex flex-col gap-3 pt-3">
              <a href="${BASE_NAVER_ORDER_URL}" target="_blank" rel="noopener noreferrer" class="w-full py-4 px-5 rounded-2xl bg-green-600 hover:bg-green-700 active:scale-[0.98] transition-all text-white font-bold text-base shadow-lg shadow-green-600/20 flex items-center justify-center gap-2">
                <span>${i18n.orderBtn}</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </a>
              <button onclick="resetQuiz()" class="w-full py-2.5 text-stone-400 hover:text-stone-600 text-xs font-medium transition-colors">
                ${i18n.restartBtn}
              </button>
            </div>
          </div>
        `;
      }
    }

    // 답변 선택 핸들러
    window.handleAnswer = function(choice) {
      const node = TREE[currentNodeKey];
      const nextTarget = node[choice];

      history.push(currentNodeKey);

      if (typeof nextTarget === "string") {
        currentNodeKey = nextTarget;
      } else if (nextTarget && nextTarget.result) {
        currentNodeKey = `result_${nextTarget.result}`;
        TREE[currentNodeKey] = nextTarget;
      }
      render();
    };

    // 이전 버튼 핸들러
    btnBack.addEventListener("click", () => {
      if (history.length > 0) {
        currentNodeKey = history.pop();
        render();
      }
    });

    // 다시 시작
    window.resetQuiz = function() {
      history = [];
      currentNodeKey = "q1";
      render();
    };

    // 시작
    setLanguage("ko");
  </script>
