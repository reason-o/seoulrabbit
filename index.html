    function drawRoundRect(ctx, x, y, width, height, radius, fillStyle, strokeStyle, lineWidth) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fillStyle) {
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
      if (strokeStyle) {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth || 1;
        ctx.stroke();
      }
    }

    function drawWrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(" ");
      let line = "";
      let lines = [];

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + " ";
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          lines.push(line.trim());
          line = words[n] + " ";
        } else {
          line = testLine;
        }
      }
      lines.push(line.trim());

      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      for (let k = 0; k < lines.length; k++) {
        ctx.fillText(lines[k], x, startY + k * lineHeight);
      }
    }

      canvas.width = width;
      canvas.height = height;

      // 1. 외부 폴라로이드
      drawRoundRect(ctx, 0, 0, width, height, 48, "#FFFFFF", "#E5E7EB", 3);

      // 2. 내부 사진 박스
      const innerX = 44;
      const innerY = 44;
      const innerW = 712;
      const innerH = 710;
      drawRoundRect(ctx, innerX, innerY, innerW, innerH, 32, "#FCF9F5", "#FEEAD8", 2.5);

      const menuObj = MENUS[currentSubNode];
      const menu = menuObj[currentLang] || menuObj["ko"];
      const i18n = I18N[currentLang];

      const rabbitImg = new Image();
      rabbitImg.crossOrigin = "anonymous";
      rabbitImg.src = "icon-green.png";

      const renderCanvasContent = () => {
        // 3. 토끼 아이콘
        const iconSize = 140;
        const iconX = (width - iconSize) / 2;
        const iconY = innerY + 45;

        if (rabbitImg.complete && rabbitImg.naturalWidth !== 0) {
          ctx.drawImage(rabbitImg, iconX, iconY, iconSize, iconSize);
        } else {
          ctx.font = "85px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("🐰", width / 2, iconY + iconSize / 2);
        }

        // 4. 주황색 배지
        const badgeW = 310;
        const badgeH = 54;
        const badgeX = (width - badgeW) / 2;
        const badgeY = iconY + iconSize + 30;
        drawRoundRect(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2, "#F97316");

        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 23px -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(i18n.recommendBadge, width / 2, badgeY + badgeH / 2 + 1);

        // 5. 메뉴명
        ctx.fillStyle = "#1C1917";
        ctx.font = "900 44px -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(menu.name, width / 2, badgeY + badgeH + 48);

        // 6. 해시태그
        ctx.fillStyle = "#EA580C";
        ctx.font = "bold 23px -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";
        ctx.fillText(menu.tag, width / 2, badgeY + badgeH + 96);

        // 7. 설명 박스
        const descBoxW = 630;
        const descBoxH = 150;
        const descBoxX = (width - descBoxW) / 2;
        const descBoxY = badgeY + badgeH + 128;
        drawRoundRect(ctx, descBoxX, descBoxY, descBoxW, descBoxH, 20, "#FFFFFF", "#E7E5E4", 2);

        ctx.fillStyle = "#44403C";
        ctx.font = "500 22px -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        drawWrapText(ctx, menu.desc, width / 2, descBoxY + descBoxH / 2, descBoxW - 50, 36);

        // 8. 하단 슬로건
        const footerY = innerY + innerH + 52;
        ctx.fillStyle = "#44403C";
        ctx.font = "bold 25px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Drink different,", width / 2, footerY);

        ctx.fillStyle = "#EA580C";
        ctx.font = "900 27px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText("SEOUL RABBIT", width / 2, footerY + 36);

        // 9. 이미지 Blob 생성 및 아이폰 분기 처리
        canvas.toBlob((blob) => {
          if (!blob) {
            saveBtn.innerHTML = originalHtml;
            saveBtn.disabled = false;
            return;
          }

          const file = new File([blob], "Seoul Rabbit.png", { type: "image/png" });
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

          // iOS 사파리 Web Share API 지원 시 -> 공유창에서 즉시 [이미지 저장] 가능
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
              files: [file],
              title: "서울래빗 추천 주스",
              text: "서울래빗이 추천해준 맞춤 주스!"
            }).then(() => {
              saveBtn.innerHTML = originalHtml;
              saveBtn.disabled = false;
            }).catch((err) => {
              if (err.name !== 'AbortError') {
                showModalFallback(canvas.toDataURL("image/png"));
              }
              saveBtn.innerHTML = originalHtml;
              saveBtn.disabled = false;
            });
          } else if (isIOS) {
            // iOS 인앱 브라우저 등에서 share 미지원 시 길게 누르는 모달 제공
            showModalFallback(canvas.toDataURL("image/png"));
            saveBtn.innerHTML = originalHtml;
            saveBtn.disabled = false;
          } else {
            // PC / 안드로이드 일반 다운로드
            const link = document.createElement("a");
            link.download = "Seoul Rabbit.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
            saveBtn.innerHTML = originalHtml;
            saveBtn.disabled = false;
          }
        }, "image/png");
      };

      function showModalFallback(dataUrl) {
        const modal = document.getElementById("image-modal");
        const previewImg = document.getElementById("modal-img-preview");
        previewImg.src = dataUrl;
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }

      if (rabbitImg.complete) {
        renderCanvasContent();
      } else {
        rabbitImg.onload = renderCanvasContent;
        rabbitImg.onerror = renderCanvasContent;
      }
    };

    function render() {
      const i18n = I18N[currentLang];

      if (currentView === "home") {
        langBar.classList.remove("hidden");
        homeTitleBox.classList.remove("hidden");
        mainHeader.classList.remove("hidden");
        mainHeader.className = "p-4 pb-2 relative border-b border-orange-50";
        btnBack.classList.add("hidden");
        mainFooter.classList.remove("hidden");
      } else if (currentView === "question") {
        langBar.classList.add("hidden");
        homeTitleBox.classList.add("hidden");
        mainHeader.className = "p-3 text-center relative border-b border-stone-100 min-h-[44px]";
        btnBack.classList.remove("hidden");
        mainFooter.classList.remove("hidden");
      } else if (currentView === "result") {
        langBar.classList.add("hidden");
        homeTitleBox.classList.add("hidden");
        mainHeader.className = "p-3 text-center relative border-b border-stone-100 min-h-[44px]";
        btnBack.classList.remove("hidden");
        mainFooter.classList.add("hidden");
      }

      // 1. 홈 화면
      if (currentView === "home") {
        let html = `
          <div class="animate-fade-in flex flex-col items-center gap-3 py-1 w-full">
            <div class="grid grid-cols-2 gap-3 w-full px-1">
        `;
        
        STATUS_CATEGORIES.forEach((cat, index) => {
          const item = cat[currentLang] || cat["ko"];
          const isImageFile = cat.icon.includes(".");
          const isLastItem = (index === STATUS_CATEGORIES.length - 1);
          const gridSpan = isLastItem ? "col-span-2 max-w-[200px] mx-auto w-full" : "w-full";

          const iconMarkup = isImageFile
            ? `<img src="${cat.icon}" alt="icon" onerror="this.onerror=null; this.outerHTML='<span class=\\'text-3xl mb-1 leading-none drop-shadow\\'>${cat.fallbackEmoji || '🥕'}</span>';" class="w-14 h-14 object-contain mb-1 drop-shadow-[0_3px_6px_rgba(0,0,0,0.12)]" />`
            : `<span class="text-3xl mb-1 leading-none drop-shadow">${cat.icon}</span>`;

          html += `
            <button onclick="selectStatus('${cat.id}')" style="${cat.style}" class="${gridSpan} p-3 rounded-2xl border-2 active:scale-[0.95] transition-transform duration-100 flex flex-col items-center justify-center text-center min-h-[114px]">
              ${iconMarkup}
              <h2 class="text-sm font-black leading-snug break-keep whitespace-pre-line mt-0.5">${item.title}</h2>
            </button>
          `;
        });

        html += `
            </div>

            <div class="pt-2 w-full flex justify-center">
              <a href="https://m.booking.naver.com/order/bizes/1140512/items/5866364?area=bnq" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-orange-50 text-orange-700 border border-orange-200 active:scale-95 transition-transform text-xs font-black shadow-sm">
                <span>🥕</span>
                <span>${i18n.exploreMenuBtn}</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
                </svg>
              </a>
            </div>
          </div>
        `;
        viewContainer.innerHTML = html;
      }

      // 2. 질문 화면
      else if (currentView === "question") {
        const node = SUB_QUESTIONS[currentSubNode];
        const qData = node.questions[currentLang] || node.questions["ko"];
        const yesLabel = qData.yesText || i18n.defaultYes;
        const noLabel = qData.noText || i18n.defaultNo;

        let introBanner = "";
        if (node.intro) {
          const introText = node.intro[currentLang] || node.intro["ko"];
          introBanner = `
            <div class="mb-4 inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-orange-100/90 text-orange-700 border border-orange-200 text-xs font-black shadow-sm break-keep">
              <span>🐰</span>
              <span>${introText}</span>
            </div>
          `;
        }

        viewContainer.innerHTML = `
          <div class="animate-fade-in flex flex-col justify-between h-full py-2">
            <div class="my-auto text-center py-4">
              ${introBanner}
              <h2 class="text-xl sm:text-2xl font-black text-stone-900 leading-snug break-keep">
                ${qData.q}
              </h2>
            </div>

            <div class="grid grid-cols-1 gap-2.5 pt-4">
              <button onclick="handleAnswer('yes')" class="w-full py-3.5 px-4 rounded-2xl bg-orange-500 active:bg-orange-600 active:scale-[0.98] transition-all text-white font-bold text-sm shadow-md shadow-orange-500/20 flex items-center justify-center text-center break-keep">
                ${yesLabel}
              </button>
              <button onclick="handleAnswer('no')" class="w-full py-3.5 px-4 rounded-2xl bg-stone-100 active:bg-stone-200 active:scale-[0.98] transition-all text-stone-700 font-semibold text-sm flex items-center justify-center text-center break-keep">
                ${noLabel}
              </button>
            </div>
          </div>
        `;
      }

      // 3. 결과 화면
      else if (currentView === "result") {
        const menuObj = MENUS[currentSubNode];
        const menu = menuObj[currentLang] || menuObj["ko"];
        const targetOrderUrl = menuObj.orderUrl;

        viewContainer.innerHTML = `
          <div class="animate-fade-in flex flex-col justify-between h-full py-1">
            
            <!-- 폴라로이드 사진 프레임 (화면 UI) -->
            <div class="w-full max-w-[320px] bg-white p-4 pb-7 rounded-2xl border border-stone-200 shadow-xl shadow-stone-900/10 mx-auto my-auto flex flex-col items-center">
              
              <!-- 폴라로이드 내부 박스 -->
              <div class="w-full bg-[#FCF9F5] border border-orange-100/90 rounded-2xl p-4 flex flex-col items-center text-center">
                
                <!-- 상단 토끼 캐릭터 -->
                <div class="w-14 h-14 mb-2.5 flex items-center justify-center">
                  <img src="icon-green.png" alt="Seoul Rabbit" onerror="this.onerror=null; this.outerHTML='<span class=\\'text-4xl\\'>🐰</span>';" class="w-14 h-14 object-contain drop-shadow-sm" />
                </div>

                <!-- 오늘의 건강한 선택 캡슐 배지 -->
                <div class="inline-flex items-center justify-center px-4 py-1.5 bg-orange-500 text-white text-xs font-black tracking-tight rounded-full mb-2">
                  ${i18n.recommendBadge}
                </div>

                <h2 class="text-2xl font-black text-stone-900 tracking-tight mb-1">
                  ${menu.name}
                </h2>

                <p class="text-xs font-bold text-orange-600 tracking-tight mb-2.5">
                  ${menu.tag}
                </p>

                <!-- 설명 박스 -->
                <div class="w-full bg-white/95 p-3 rounded-xl border border-stone-200/70 text-stone-700 text-xs leading-relaxed break-keep text-center shadow-inner min-h-[58px] flex items-center justify-center">
                  ${menu.desc}
                </div>
              </div>

              <!-- 폴라로이드 하단 2줄 슬로건 -->
              <div class="w-full pt-4 text-center">
                <p class="text-xs font-bold tracking-tight text-stone-700 leading-tight">
                  Drink different,
                </p>
                <p class="text-xs font-black tracking-wider text-orange-600 leading-tight uppercase mt-0.5">
                  Seoul Rabbit
                </p>
              </div>
            </div>

            <!-- 하단 액션 버튼 그룹 -->
            <div class="flex flex-col gap-2 pt-2.5 w-full max-w-[320px] mx-auto">
              <!-- 네이버 주문하기 버튼 (메인 강조) -->
              <a href="${targetOrderUrl}" target="_blank" rel="noopener noreferrer" class="w-full py-3.5 px-5 rounded-2xl bg-green-600 active:bg-green-700 active:scale-[0.98] transition-all text-white font-black text-base shadow-md shadow-green-600/25 flex items-center justify-center gap-2">
                <span>${i18n.orderBtn}</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </a>

              <!-- 이미지 저장 버튼 (화이트 서브 버튼) -->
              <button id="btn-save-image" onclick="saveResultImage()" class="w-full py-3 px-5 rounded-2xl bg-white border border-stone-300 active:bg-stone-50 active:scale-[0.98] transition-all text-stone-700 font-bold text-sm shadow-sm flex items-center justify-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span>${i18n.saveImgBtn}</span>
              </button>

              <!-- 처음으로 버튼 -->
              <button onclick="resetQuiz()" class="w-full py-1 text-stone-400 active:text-stone-700 text-xs font-bold transition-colors">
                ${i18n.restartBtn}
              </button>
            </div>
          </div>
        `;
      }
    }

    window.history.replaceState({ view: "home", nodeKey: null }, "");
    setLanguage("ko");
  </script>
</body>
</html>
